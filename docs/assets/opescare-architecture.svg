<svg viewBox="0 0 960 980" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>OpesCare platform architecture — 45 modules in 7 domains</title>
  <style>
    .band   { fill:#f8fafc; stroke:#e2e8f0; stroke-width:1; }
    .jbar   { fill:#0F4C81; }
    .pbar   { fill:#475569; }
    .dtitle { font-size:17px; font-weight:700; fill:#0f172a; }
    .drole  { font-size:11.5px; fill:#64748b; }
    .mods   { font-size:12px; fill:#334155; }
    .h1     { font-size:22px; font-weight:800; fill:#0F4C81; }
    .sub    { font-size:12.5px; fill:#64748b; }
    .spine  { font-size:11px; font-weight:700; fill:#0F4C81; letter-spacing:.5px; }
    .xcut   { font-size:11px; font-weight:700; fill:#475569; letter-spacing:.5px; }
    .cnt    { font-size:11px; font-weight:700; fill:#0F4C81; }
    .cntp   { font-size:11px; font-weight:700; fill:#475569; }
  </style>
  <rect x="0" y="0" width="960" height="980" fill="#ffffff"/>
  <text x="40" y="34" class="h1">OpesCare — Platform Module Architecture</text>
  <text x="40" y="55" class="sub">45 domain modules · national digital health-ID &amp; interoperability platform (Laravel 13 / PHP 8.3 / Postgres)</text>
  <text x="22" y="240" class="spine" transform="rotate(-90 22 240)">PATIENT JOURNEY</text>
  <text x="22" y="800" class="xcut" transform="rotate(-90 22 800)">CROSS-CUTTING</text>
  <g>
    <rect class="band" x="40" y="74" width="880" height="100" rx="10"/>
    <rect class="jbar" x="40" y="74" width="6" height="100" rx="3"/>
    <text x="62" y="104" class="dtitle">Identity &amp; Access <tspan class="cnt">· 5</tspan></text>
    <text x="62" y="124" class="drole">Who you are, and who may see your record</text>
    <text x="62" y="152" class="mods">Auth · AccessControl · PatientIdentity · MasterPatientIndex · ConsentManagement</text>
  </g>
  <g>
    <rect class="band" x="40" y="186" width="880" height="100" rx="10"/>
    <rect class="jbar" x="40" y="186" width="6" height="100" rx="3"/>
    <text x="62" y="216" class="dtitle">Clinical Care <tspan class="cnt">· 8</tspan></text>
    <text x="62" y="236" class="drole">Encounters, decisions and specialty care</text>
    <text x="62" y="264" class="mods">EncounterManagement · Triage · ClinicalDecisionSupport · WardManagement · Maternity · Immunization · Telemedicine · OperationalFlow</text>
  </g>
  <g>
    <rect class="band" x="40" y="298" width="880" height="100" rx="10"/>
    <rect class="jbar" x="40" y="298" width="6" height="100" rx="3"/>
    <text x="62" y="328" class="dtitle">Facility Operations <tspan class="cnt">· 6</tspan></text>
    <text x="62" y="348" class="drole">Running the front door and the back office</text>
    <text x="62" y="376" class="mods">Appointments · Queue · Staff · Inventory · DataImport · Search</text>
  </g>
  <g>
    <rect class="band" x="40" y="410" width="880" height="100" rx="10"/>
    <rect class="jbar" x="40" y="410" width="6" height="100" rx="3"/>
    <text x="62" y="440" class="dtitle">Commerce &amp; Coverage <tspan class="cnt">· 4</tspan></text>
    <text x="62" y="460" class="drole">Getting paid: bills, claims, plans, referrals</text>
    <text x="62" y="488" class="mods">Billing · Insurance · Subscription · Referral</text>
  </g>
  <g>
    <rect class="band" x="40" y="522" width="880" height="100" rx="10"/>
    <rect class="jbar" x="40" y="522" width="6" height="100" rx="3"/>
    <text x="62" y="552" class="dtitle">Population &amp; Interoperability <tspan class="cnt">· 6</tspan></text>
    <text x="62" y="572" class="drole">Beyond one facility: nation, partners, standards</text>
    <text x="62" y="600" class="mods">PublicHealth · Connect · Fhir · CareMap · Partners · ResearchAccess</text>
  </g>
  <g>
    <rect class="band" x="40" y="646" width="880" height="100" rx="10"/>
    <rect class="pbar" x="40" y="646" width="6" height="100" rx="3"/>
    <text x="62" y="676" class="dtitle">Engagement &amp; Communication <tspan class="cntp">· 6</tspan></text>
    <text x="62" y="696" class="drole">Reaching patients and staff on every channel</text>
    <text x="62" y="724" class="mods">Notifications · Messaging · Broadcasts · Communications · Tasks · Support</text>
  </g>
  <g>
    <rect class="band" x="40" y="758" width="880" height="118" rx="10"/>
    <rect class="pbar" x="40" y="758" width="6" height="118" rx="3"/>
    <text x="62" y="788" class="dtitle">Platform, Trust &amp; Growth <tspan class="cntp">· 10</tspan></text>
    <text x="62" y="808" class="drole">Security, governance, analytics, resilience, expansion</text>
    <text x="62" y="836" class="mods">Governance · SecurityOperations · Analytics · Admin · FileStorage · Offline · OpesCareLite</text>
    <text x="62" y="858" class="mods">Legal · FacilityReadiness · CountryExpansion</text>
  </g>
  <text x="40" y="906" class="sub">Top 5 bands follow the patient through the system; bottom 2 bands serve every band above them.</text>
</svg>
