<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpesCare — Helix v2 Theme Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --b:#0F4C81;--bd:#0A3560;--bl:#1A6AAF;
  --t:#0F766E;--tl:#14B8A6;
  --sid:#0B1F3A;--sid2:#0F2744;
  --bg:#F0F4F8;--sur:#fff;--sur2:#F8FAFC;
  --bdr:#E2E8F0;--txt:#0F172A;--txt2:#334155;--muted:#64748B;
  --warn:#B45309;--warnl:#FEF3C7;
  --danger:#B91C1C;--dangerl:#FEE2E2;
  --ok:#15803D;--okl:#DCFCE7;
  --info:#1D4ED8;--infol:#DBEAFE;
  --rad:8px;--rads:4px;--radl:12px;
  --sidebar-w:240px;--topbar-h:56px;
  --shd:0 1px 3px rgba(0,0,0,.08);--shd2:0 4px 12px rgba(0,0,0,.1);
}
html,body{height:100%;font-family:Inter,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5}
/* PREVIEW BAR */
.preview-bar{position:fixed;top:0;left:0;right:0;z-index:200;height:48px;background:#0B1F3A;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center}
.pb-logo{display:flex;align-items:center;gap:8px;padding:0 16px;border-right:1px solid rgba(255,255,255,.08);height:100%;flex-shrink:0}
.pb-ico{width:26px;height:26px;background:var(--b);border-radius:6px;display:flex;align-items:center;justify-content:center}
.pb-ico svg{width:14px;height:14px;color:#fff;stroke:currentColor;fill:none;stroke-width:2}
.pb-name{font-size:13px;font-weight:700;color:#F1F5F9}
.pb-tag{font-size:10px;background:rgba(56,189,248,.15);color:#7DD3FC;border:1px solid rgba(56,189,248,.2);border-radius:4px;padding:1px 6px;margin-left:6px}
.pb-tabs{display:flex;height:100%;overflow-x:auto;flex:1}
.pb-tabs::-webkit-scrollbar{height:3px}.pb-tabs::-webkit-scrollbar-track{background:transparent}.pb-tabs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px}
.pb-tab{display:flex;align-items:center;gap:5px;padding:0 14px;font-size:12px;font-weight:500;color:#7A94B0;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .12s;flex-shrink:0;user-select:none}
.pb-tab:hover{color:#CBD5E1;background:rgba(255,255,255,.04)}
.pb-tab.on{color:#F1F5F9;border-bottom-color:#38BDF8}
.pb-tab svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
/* PORTAL LAYOUT */
.portal-pane{display:none;position:fixed;top:48px;left:0;right:0;bottom:0}
.portal-pane.active{display:flex}
.portal-wrap{display:flex;width:100%;height:100%;overflow:hidden}
.portal-sidebar{width:var(--sidebar-w);background:var(--sid);flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto}
.portal-sidebar::-webkit-scrollbar{width:4px}.portal-sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1)}
.portal-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.portal-topbar{height:var(--topbar-h);background:#fff;border-top:3px solid var(--b);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 20px;gap:8px;flex-shrink:0;box-shadow:0 1px 0 var(--bdr)}
.portal-content{flex:1;overflow-y:auto;padding:24px;background:var(--bg)}
.portal-content::-webkit-scrollbar{width:6px}.portal-content::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:3px}
.portal-page{display:none}
.portal-page.active{display:block}
/* NO-SIDEBAR LAYOUTS */
.fullpage-pane{display:none;position:fixed;top:48px;left:0;right:0;bottom:0;overflow-y:auto;background:var(--bg)}
.fullpage-pane.active{display:block}
.auth-wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:40px 20px}
/* SIDEBAR COMPONENTS */
.sb-brand{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid rgba(255,255,255,.06)}
.sb-logo{width:32px;height:32px;background:var(--b);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-logo svg{width:16px;height:16px;color:#fff;stroke:currentColor;fill:none;stroke-width:2}
.sb-name{font-size:14px;font-weight:700;color:#F1F5F9}
.sb-sub{font-size:11px;color:#7A94B0}
.sb-rb{padding:8px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
.role-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;background:rgba(14,188,163,.12);color:#5EEAD4;border:1px solid rgba(14,188,163,.2);border-radius:4px;padding:3px 8px}
.role-badge svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2}
.sb-nav{flex:1;padding:8px 0}
.sb-sec{font-size:10px;font-weight:700;letter-spacing:.08em;color:#4A6080;text-transform:uppercase;padding:12px 16px 4px}
.sb-link{display:flex;align-items:center;gap:9px;padding:8px 16px;font-size:13px;font-weight:500;color:#94A9C0;text-decoration:none;cursor:pointer;border-left:3px solid transparent;transition:all .1s;user-select:none}
.sb-link svg{width:15px;height:15px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2}
.sb-link:hover{color:#CBD5E1;background:rgba(255,255,255,.04)}
.sb-link.active{color:#F1F5F9;background:rgba(56,189,248,.08);border-left-color:#38BDF8}
.sb-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.06);margin-top:auto}
.sb-user{display:flex;align-items:center;gap:10px}
.sb-av{width:32px;height:32px;border-radius:50%;background:var(--b);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.sb-uname{font-size:13px;font-weight:600;color:#CBD5E1}
.sb-urole{font-size:11px;color:#7A94B0}
/* TOPBAR */
.tb-crumb{font-size:13px;color:var(--muted)}
.tb-sep{color:var(--bdr);margin:0 4px}
.tb-page{font-size:13px;font-weight:600;color:var(--txt)}
.tb-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.icon-btn{width:32px;height:32px;border-radius:var(--rads);border:1px solid var(--bdr);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:all .1s}
.icon-btn:hover{background:var(--sur2);color:var(--txt)}
.icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.tb-av{width:28px;height:28px;border-radius:50%;background:var(--b);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tb-uname{font-size:12px;font-weight:500;color:var(--txt2);margin-left:4px}
/* STAT CARDS */
.stat-grid{display:grid;gap:14px;margin-bottom:20px}
.cols-4{grid-template-columns:repeat(4,1fr)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-2{grid-template-columns:repeat(2,1fr)}
.cols-5{grid-template-columns:repeat(5,1fr)}
.cols-6{grid-template-columns:repeat(6,1fr)}
.cols-7{grid-template-columns:repeat(7,1fr)}
.stat-card{background:#fff;border-radius:var(--rad);padding:14px 16px;border:1px solid var(--bdr);border-left:3px solid var(--b);box-shadow:var(--shd)}
.stat-card.teal{border-left-color:var(--t)}.stat-card.ok{border-left-color:var(--ok)}.stat-card.danger{border-left-color:var(--danger)}.stat-card.warn{border-left-color:var(--warn)}.stat-card.info{border-left-color:var(--info)}
.sc-ic{width:34px;height:34px;background:rgba(15,76,129,.08);border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.sc-ic svg{width:17px;height:17px;color:var(--b);stroke:currentColor;fill:none;stroke-width:2}
.stat-card.teal .sc-ic{background:rgba(15,118,110,.08)}.stat-card.teal .sc-ic svg{color:var(--t)}
.stat-card.ok .sc-ic{background:rgba(21,128,61,.08)}.stat-card.ok .sc-ic svg{color:var(--ok)}
.stat-card.danger .sc-ic{background:rgba(185,28,28,.08)}.stat-card.danger .sc-ic svg{color:var(--danger)}
.stat-card.warn .sc-ic{background:rgba(180,83,9,.08)}.stat-card.warn .sc-ic svg{color:var(--warn)}
.stat-card.info .sc-ic{background:rgba(29,78,216,.08)}.stat-card.info .sc-ic svg{color:var(--info)}
.sc-val{font-size:22px;font-weight:800;color:var(--txt);line-height:1.1}
.sc-lbl{font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
.sc-delta{font-size:11px;margin-top:4px;color:var(--ok)}
/* PANEL */
.panel{background:#fff;border:1px solid var(--bdr);border-radius:var(--rad);overflow:hidden;margin-bottom:18px;box-shadow:var(--shd)}
.panel-hd{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--bdr)}
.panel-title{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--txt)}
.panel-title svg{width:14px;height:14px;color:var(--b);stroke:currentColor;fill:none;stroke-width:2}
.panel-body{padding:16px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.content-grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}
/* TABLE */
.data-table{width:100%;border-collapse:collapse}
.data-table th{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:9px 14px;text-align:left;border-bottom:2px solid var(--bdr);background:var(--sur2);white-space:nowrap}
.data-table td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--bdr);color:var(--txt2);vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:var(--sur2)}
/* BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.badge svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2}
.badge-ok{background:var(--okl);color:var(--ok)}.badge-danger{background:var(--dangerl);color:var(--danger)}.badge-warn{background:var(--warnl);color:var(--warn)}.badge-info{background:var(--infol);color:var(--info)}.badge-muted{background:#F1F5F9;color:var(--muted)}.badge-b{background:rgba(15,76,129,.1);color:var(--b)}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--rad);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .1s;text-decoration:none;white-space:nowrap}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.btn-primary{background:var(--b);color:#fff}.btn-primary:hover{background:var(--bd)}
.btn-secondary{background:#fff;color:var(--txt);border:1px solid var(--bdr)}.btn-secondary:hover{background:var(--sur2)}
.btn-teal{background:var(--t);color:#fff}.btn-teal:hover{background:#0A6560}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#991B1B}
.btn-ok{background:var(--ok);color:#fff}
.btn-warn{background:var(--warn);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px}
/* FORMS */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--txt);margin-bottom:5px}
.form-label span{color:var(--danger)}
.form-control{width:100%;padding:9px 12px;border:1px solid var(--bdr);border-radius:var(--rad);font-size:13px;font-family:inherit;color:var(--txt);background:#fff;transition:border-color .1s;outline:none}
.form-control:focus{border-color:var(--b);box-shadow:0 0 0 3px rgba(15,76,129,.1)}
.form-control::placeholder{color:var(--muted)}
select.form-control{cursor:pointer}
textarea.form-control{resize:vertical;min-height:80px}
.form-hint{font-size:11px;color:var(--muted);margin-top:3px}
.form-row{display:grid;gap:14px}
.form-row.cols-2{grid-template-columns:1fr 1fr}
.form-row.cols-3{grid-template-columns:1fr 1fr 1fr}
/* FILTER BAR */
.filter-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filter-bar .form-control{width:auto;min-width:140px}
.search-bar-lg{display:flex;align-items:center;background:#fff;border:1px solid var(--bdr);border-radius:var(--rad);padding:0 12px;gap:8px;margin-bottom:16px}
.search-bar-lg svg{width:16px;height:16px;color:var(--muted);stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
.search-bar-lg input{flex:1;border:none;outline:none;font-size:14px;padding:10px 0;font-family:inherit;color:var(--txt)}
.search-bar-lg input::placeholder{color:var(--muted)}
/* PAGE HEADER */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.page-header h2{font-size:18px;font-weight:700;color:var(--txt)}
.page-header p{font-size:13px;color:var(--muted);margin-top:2px}
.ph-actions{display:flex;align-items:center;gap:8px}
/* MONO TEXT */
.mono{font-family:'JetBrains Mono',monospace;font-size:12px}
/* STATUS DOT */
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.dot-ok{background:var(--ok)}.dot-danger{background:var(--danger)}.dot-warn{background:var(--warn)}.dot-muted{background:var(--muted)}.dot-info{background:var(--info)}
/* TABS */
.tab-nav{display:flex;border-bottom:2px solid var(--bdr);margin-bottom:18px;gap:0}
.tab-nav .tab{padding:10px 16px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .1s;white-space:nowrap}
.tab-nav .tab:hover{color:var(--txt)}
.tab-nav .tab.active{color:var(--b);border-bottom-color:var(--b);font-weight:600}
.tab-content{display:none}.tab-content.active{display:block}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-box{background:#fff;border-radius:var(--radl);padding:24px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-title{font-size:16px;font-weight:700;color:var(--txt)}
.modal-close{width:28px;height:28px;border-radius:4px;border:none;background:var(--sur2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.modal-close svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--bdr)}
/* ALERT BANNERS */
.alert{padding:12px 16px;border-radius:var(--rad);display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;font-size:13px}
.alert svg{width:15px;height:15px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;margin-top:1px}
.alert-danger{background:var(--dangerl);color:var(--danger);border:1px solid rgba(185,28,28,.2)}
.alert-warn{background:var(--warnl);color:var(--warn);border:1px solid rgba(180,83,9,.2)}
.alert-ok{background:var(--okl);color:var(--ok);border:1px solid rgba(21,128,61,.2)}
.alert-info{background:var(--infol);color:var(--info);border:1px solid rgba(29,78,216,.2)}
/* STEP INDICATOR */
.step-indicator{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:28px}
.step-item{display:flex;align-items:center;gap:8px}
.step-num{width:28px;height:28px;border-radius:50%;border:2px solid var(--bdr);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);background:#fff;flex-shrink:0}
.step-lbl{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.step-line{width:40px;height:2px;background:var(--bdr);margin:0 4px}
.step-item.done .step-num{background:var(--ok);border-color:var(--ok);color:#fff}
.step-item.active .step-num{background:var(--b);border-color:var(--b);color:#fff}
.step-item.active .step-lbl{color:var(--b);font-weight:600}
.step-item.done .step-line{background:var(--ok)}
/* QUICK ACTIONS */
.qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.qa-card{background:#fff;border:1px solid var(--bdr);border-radius:var(--rad);padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:all .12s}
.qa-card:hover{border-color:var(--b);box-shadow:0 2px 8px rgba(15,76,129,.12)}
.qa-ic{width:36px;height:36px;border-radius:8px;background:rgba(15,76,129,.08);display:flex;align-items:center;justify-content:center}
.qa-ic svg{width:18px;height:18px;color:var(--b);stroke:currentColor;fill:none;stroke-width:2}
.qa-lbl{font-size:12px;font-weight:600;color:var(--txt2);text-align:center}
/* HID CARD */
.hid-card{background:linear-gradient(135deg,#0A3560 0%,#0F4C81 50%,#1A6AAF 100%);border-radius:var(--radl);padding:20px;color:#fff;margin-bottom:18px;position:relative;overflow:hidden}
.hid-card::before{content:'';position:absolute;top:-20px;right:-20px;width:150px;height:150px;background:rgba(255,255,255,.04);border-radius:50%}
.hid-id{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;letter-spacing:.05em;color:#7DD3FC;margin-bottom:4px}
.hid-name{font-size:20px;font-weight:700;margin-bottom:2px}
.hid-meta{font-size:12px;color:rgba(255,255,255,.65);display:flex;gap:16px;margin-top:4px}
.hid-chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.hid-chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:3px 8px;font-size:11px;font-weight:600}
.hid-chip.danger{background:rgba(185,28,28,.25);border-color:rgba(185,28,28,.4)}
/* EMPTY STATE */
.empty-state{padding:40px;text-align:center}
.empty-state svg{width:40px;height:40px;color:var(--muted);stroke:currentColor;fill:none;stroke-width:1.5;margin:0 auto 12px}
.empty-state p{font-size:13px;color:var(--muted);font-weight:500}
/* HEALTH BAR */
.health-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--okl);border:1px solid rgba(21,128,61,.2);border-radius:var(--rad);margin-bottom:10px;font-size:12px;color:var(--ok);font-weight:600}
.health-bar svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
/* PROGRESS BAR */
.progress{height:6px;background:var(--bdr);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--b);border-radius:3px;transition:width .3s}
.progress-fill.ok{background:var(--ok)}.progress-fill.warn{background:var(--warn)}.progress-fill.danger{background:var(--danger)}
/* QR PLACEHOLDER */
.qr-box{width:80px;height:80px;background:var(--sur2);border:1px solid var(--bdr);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);font-weight:500}
/* MAP PLACEHOLDER */
.map-placeholder{background:#1a2744;border-radius:var(--rad);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.map-placeholder::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.06) 1px,transparent 1px);background-size:24px 24px}
.map-placeholder span{position:relative;font-size:13px;color:rgba(255,255,255,.4);font-weight:500}
/* CSS BAR CHART */
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:120px;padding:0 4px}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar{width:100%;background:var(--b);border-radius:3px 3px 0 0;min-height:4px;transition:height .3s}
.bar-lbl{font-size:10px;color:var(--muted);text-align:center}
.bar-val{font-size:10px;color:var(--txt2);font-weight:600}
/* KANBAN */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kanban-col{background:var(--sur2);border-radius:var(--rad);padding:12px;border:1px solid var(--bdr)}
.kanban-col-hd{font-size:12px;font-weight:700;color:var(--txt);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.kanban-card{background:#fff;border:1px solid var(--bdr);border-radius:var(--rads);padding:10px;margin-bottom:8px;cursor:pointer;transition:box-shadow .1s}
.kanban-card:hover{box-shadow:var(--shd2)}
.kanban-card p{font-size:12px;color:var(--txt2);margin-top:4px}
/* PLAN CARDS */
.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.plan-card{background:#fff;border:2px solid var(--bdr);border-radius:var(--radl);padding:20px;transition:all .15s;cursor:pointer}
.plan-card:hover,.plan-card.selected{border-color:var(--b);box-shadow:0 0 0 3px rgba(15,76,129,.1)}
.plan-card.popular{border-color:var(--b)}
.plan-name{font-size:16px;font-weight:700;color:var(--txt);margin-bottom:4px}
.plan-price{font-size:26px;font-weight:800;color:var(--b);margin:8px 0}
.plan-price span{font-size:13px;font-weight:500;color:var(--muted)}
.plan-features{list-style:none;margin-top:12px}
.plan-features li{font-size:12px;color:var(--txt2);padding:4px 0;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--bdr)}
.plan-features li:last-child{border-bottom:none}
.plan-features li::before{content:'✓';color:var(--ok);font-weight:700;font-size:11px}
/* TOGGLE SWITCH */
.toggle-wrap{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--bdr)}
.toggle-wrap:last-child{border-bottom:none}
.toggle-info h4{font-size:13px;font-weight:600;color:var(--txt)}
.toggle-info p{font-size:12px;color:var(--muted);margin-top:1px}
.toggle{width:40px;height:22px;background:var(--bdr);border-radius:11px;position:relative;cursor:pointer;flex-shrink:0;transition:background .2s}
.toggle.on{background:var(--b)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on::after{left:21px}
/* CODE BLOCK */
.code-block{background:#0F172A;border-radius:var(--rad);padding:14px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#94A3B8;overflow-x:auto;margin:8px 0}
.code-block .k{color:#7DD3FC}.code-block .s{color:#86EFAC}.code-block .c{color:#64748B}
/* FHIR EXPLORER */
.fhir-resource{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--bdr);border-radius:var(--rads);cursor:pointer;margin-bottom:6px;font-size:13px;color:var(--txt2);transition:all .1s}
.fhir-resource:hover{border-color:var(--b);color:var(--b);background:rgba(15,76,129,.04)}
.fhir-resource svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;color:var(--b)}
/* CARD GRID */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.card-item{background:#fff;border:1px solid var(--bdr);border-radius:var(--rad);padding:14px;cursor:pointer;transition:all .12s}
.card-item:hover{border-color:var(--b);box-shadow:var(--shd2)}
.card-item.selected{border-color:var(--b);background:rgba(15,76,129,.03)}
.card-item h4{font-size:13px;font-weight:600;color:var(--txt);margin-bottom:4px}
.card-item p{font-size:12px;color:var(--muted)}
/* SAFETY STRIP */
.safety-strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.safety-pill{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:600}
.safety-pill.danger{background:var(--dangerl);color:var(--danger)}
.safety-pill.warn{background:var(--warnl);color:var(--warn)}
.safety-pill.info{background:var(--infol);color:var(--info)}
.safety-pill svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
/* AUTH SPLIT */
.auth-split{display:flex;width:100%;max-width:900px;min-height:540px;border-radius:var(--radl);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.auth-left{width:360px;background:linear-gradient(160deg,#0A3560,#0F4C81);padding:36px;display:flex;flex-direction:column;flex-shrink:0}
.auth-left h1{font-size:24px;font-weight:800;color:#fff;margin-bottom:8px}
.auth-left p{font-size:13px;color:rgba(255,255,255,.65);line-height:1.6;margin-bottom:24px}
.auth-bullet{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.auth-bullet-ic{width:24px;height:24px;background:rgba(255,255,255,.1);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.auth-bullet-ic svg{width:12px;height:12px;color:#7DD3FC;stroke:currentColor;fill:none;stroke-width:2}
.auth-bullet-txt{font-size:12px;color:rgba(255,255,255,.75);line-height:1.4}
.auth-right{flex:1;background:#fff;padding:36px;display:flex;flex-direction:column;justify-content:center}
.auth-right h2{font-size:20px;font-weight:700;color:var(--txt);margin-bottom:4px}
.auth-right p{font-size:13px;color:var(--muted);margin-bottom:24px}
.auth-logo{display:flex;align-items:center;gap:8px;margin-bottom:28px}
.auth-logo-ic{width:36px;height:36px;background:var(--b);border-radius:8px;display:flex;align-items:center;justify-content:center}
.auth-logo-ic svg{width:18px;height:18px;color:#fff;stroke:currentColor;fill:none;stroke-width:2}
.auth-logo-name{font-size:18px;font-weight:800;color:var(--txt)}
.portal-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.portal-pill{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--bdr);color:var(--muted);cursor:pointer}
.portal-pill:hover,.portal-pill.active{background:var(--b);border-color:var(--b);color:#fff}
/* CENTERED AUTH CARD */
.auth-card{background:#fff;border-radius:var(--radl);padding:36px;width:100%;max-width:440px;box-shadow:0 8px 32px rgba(0,0,0,.1)}
.auth-card h2{font-size:20px;font-weight:700;color:var(--txt);margin-bottom:4px}
.auth-card p{font-size:13px;color:var(--muted);margin-bottom:24px}
/* OTP INPUT */
.otp-wrap{display:flex;gap:10px;justify-content:center;margin:20px 0}
.otp-input{width:52px;height:60px;border:2px solid var(--bdr);border-radius:var(--rad);font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;text-align:center;color:var(--txt);outline:none;transition:border-color .1s}
.otp-input:focus{border-color:var(--b)}
/* STRENGTH INDICATOR */
.strength-bar{display:flex;gap:4px;margin-top:6px}
.strength-seg{flex:1;height:4px;border-radius:2px;background:var(--bdr)}
.strength-seg.weak{background:var(--danger)}.strength-seg.fair{background:var(--warn)}.strength-seg.strong{background:var(--ok)}
/* PUBLIC NAV */
.pub-nav{background:#fff;border-bottom:1px solid var(--bdr);padding:0 24px;display:flex;align-items:center;gap:16px;height:56px;position:sticky;top:0;z-index:10;box-shadow:var(--shd)}
.pub-nav-logo{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--txt);margin-right:auto}
.pub-nav-logo-ic{width:28px;height:28px;background:var(--b);border-radius:6px;display:flex;align-items:center;justify-content:center}
.pub-nav-logo-ic svg{width:14px;height:14px;color:#fff;stroke:currentColor;fill:none;stroke-width:2}
.pub-nav a{font-size:13px;font-weight:500;color:var(--txt2);text-decoration:none;cursor:pointer}
.pub-nav a:hover{color:var(--b)}
/* DIVIDER */
.divider{border:none;border-top:1px solid var(--bdr);margin:16px 0}
/* BADGE COUNT */
.badge-count{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;background:var(--danger);color:#fff;border-radius:50%;font-size:10px;font-weight:700}
/* CHART LEGEND */
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.legend-dot{width:10px;height:10px;border-radius:2px}
/* WARD GRID */
.bed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:6px;margin-top:12px}
.bed{width:100%;aspect-ratio:1;border-radius:var(--rads);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;border:1px solid}
.bed.occupied{background:var(--dangerl);border-color:rgba(185,28,28,.3);color:var(--danger)}
.bed.available{background:var(--okl);border-color:rgba(21,128,61,.3);color:var(--ok)}
.bed.maintenance{background:var(--warnl);border-color:rgba(180,83,9,.3);color:var(--warn)}
/* TIMELINE */
.timeline{padding:0;list-style:none}
.timeline-item{display:flex;gap:12px;padding-bottom:16px;position:relative}
.timeline-item::before{content:'';position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--bdr)}
.timeline-item:last-child::before{display:none}
.timeline-dot{width:24px;height:24px;border-radius:50%;background:var(--b);display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:1}
.timeline-dot svg{width:12px;height:12px;color:#fff;stroke:currentColor;fill:none;stroke-width:2}
.timeline-body{flex:1}
.timeline-title{font-size:13px;font-weight:600;color:var(--txt)}
.timeline-sub{font-size:12px;color:var(--muted)}
/* PRIORITY COLORS */
.priority-critical{color:var(--danger);font-weight:700}
.priority-urgent{color:var(--warn);font-weight:600}
.priority-routine{color:var(--info);font-weight:500}
/* CHECKBOX */
.checkbox-group{display:flex;flex-direction:column;gap:8px}
.checkbox-item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--txt2);cursor:pointer}
.checkbox-item input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:var(--b)}
/* GRID SYSTEM EXTRAS */
.cols-2-3{grid-template-columns:2fr 3fr}
.cols-3-1{grid-template-columns:3fr 1fr}
/* PHARMACY STAT */
.drug-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600}
.drug-instock{background:var(--okl);color:var(--ok)}.drug-low{background:var(--warnl);color:var(--warn)}.drug-out{background:var(--dangerl);color:var(--danger)}.drug-expiring{background:#FEF3C7;color:#92400E}
/* SIGNAL LEVEL */
.signal-red{background:#FEE2E2;color:#991B1B;border:1px solid rgba(153,27,27,.2)}
.signal-orange{background:#FEF3C7;color:#92400E;border:1px solid rgba(146,64,14,.2)}
.signal-green{background:#DCFCE7;color:#15803D;border:1px solid rgba(21,128,61,.2)}
.signal-level{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700}
</style>
</head>
